<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squint – Upload</title>
  <link rel="stylesheet" href="upload.css">
</head>
<body>
  <main class="upload-container">
    <h1>Squint – Bilder hochladen</h1>

    <form id="uploadForm" class="upload-form">
      <ol class="steps">
        <li class="step">
          <div class="form-group">
            <label for="password">1. Passwort:</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="off"
            >
          </div>
        </li>

        <li class="step">
          <div class="form-group">
            <label for="n">2. Anzahl für die Kundenauswahl (N, kleiner als Bildanzahl):</label>
            <input
              type="number"
              id="n"
              name="n"
              min="1"
              required
            >
          </div>
        </li>

        <li class="step">
          <div class="form-group">
            <label for="images">3. Bilder auswählen (mehrere):</label>
            <input
              type="file"
              id="images"
              name="images"
              accept="image/*"
              multiple
              required
            >
          </div>
          <div id="uploadProgress" class="upload-progress hidden">
            <div class="progress-bar-track"><div id="progressBar" class="progress-bar"></div></div>
            <p id="progressLabel" class="progress-label" aria-live="polite">Lädt hoch…</p>
          </div>
        </li>

        <li class="step">
          <span class="step-label">4. Auswahl (Favoriten) — erscheint nach dem Upload:</span>
          <div id="fileList" class="file-list">
            <p class="file-list-hint">Bilder auswählen, dann beginnen der Upload und die Auswahl.</p>
          </div>
          <button type="button" id="saveSelectionBtn" class="submit-btn" disabled hidden>0 von N</button>
        </li>
      </ol>
    </form>

    <div class="step">
      <span class="step-label">5. Kunden-Link:</span>
      <p class="warning">Link nur an den Kunden schicken.</p>
      <div class="token-link-container">
        <a id="tokenLink" class="token-link disabled" aria-disabled="true">Link wird nach dem Upload erzeugt…</a>
        <button id="copyBtn" class="copy-btn" disabled>Kopieren</button>
      </div>
    </div>

    <div id="error" class="error hidden">
      <h2>Fehler</h2>
      <p id="errorMessage"></p>
      <button id="retryBtn" class="retry-btn">Erneut versuchen</button>
    </div>
  </main>

  <script>
    // DOM-Elemente
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('images');
    const fileList = document.getElementById('fileList');
    const nInput = document.getElementById('n');
    const uploadProgress = document.getElementById('uploadProgress');
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const saveSelectionBtn = document.getElementById('saveSelectionBtn');
    const tokenLink = document.getElementById('tokenLink');
    const copyBtn = document.getElementById('copyBtn');
    const errorDiv = document.getElementById('error');
    const errorMessage = document.getElementById('errorMessage');
    const retryBtn = document.getElementById('retryBtn');

    const TOKEN_KEY = 'squint:last-upload-token';
    let token = sessionStorage.getItem(TOKEN_KEY) || null;

    // 3. Dateiauswahl -> Upload startet automatisch (mit Fortschritt)
    fileInput.addEventListener('change', () => {
      const files = fileInput.files;

      if (files.length === 0) {
        return;
      }

      const password = document.getElementById('password').value;
      if (!password) {
        showError('Bitte zuerst das Passwort (Schritt 1) eintragen.');
        return;
      }

      const n = parseInt(nInput.value);
      if (isNaN(n) || n < 1 || n >= files.length) {
        showError('N muss eine Zahl zwischen 1 und ' + (files.length - 1) + ' sein');
        return;
      }

      startUpload(password, n, files);
    });

    function startUpload(password, n, files) {
      errorDiv.classList.add('hidden');
      uploadProgress.classList.remove('hidden');
      progressBar.style.width = '0%';
      progressLabel.textContent = 'Lädt hoch… 0 %';
      fileInput.disabled = true;

      const formData = new FormData();
      formData.append('password', password);
      formData.append('n', n.toString());
      formData.append('favorites', '[]');

      for (let i = 0; i < files.length; i++) {
        formData.append('images', files[i]);
      }

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload');

      xhr.upload.addEventListener('progress', (ev) => {
        if (ev.lengthComputable) {
          const pct = Math.round((ev.loaded / ev.total) * 100);
          progressBar.style.width = pct + '%';
          progressLabel.textContent = 'Lädt hoch… ' + pct + ' %';
        }
      });

      xhr.addEventListener('load', () => {
        uploadProgress.classList.add('hidden');

        let result = {};
        try {
          result = JSON.parse(xhr.responseText);
        } catch { /* leere Antwort unten behandeln */ }

        if (xhr.status === 200 && result.token) {
          token = result.token;
          sessionStorage.setItem(TOKEN_KEY, token);
          loadSelection();
        } else {
          showError(result.error || 'Upload fehlgeschlagen (HTTP ' + xhr.status + ')');
          fileInput.disabled = false;
        }
      });

      xhr.addEventListener('error', () => {
        uploadProgress.classList.add('hidden');
        showError('Netzwerkfehler beim Upload');
        fileInput.disabled = false;
      });

      xhr.send(formData);
    }

    // 4. Auswahl: Server-Thumbnails — ihr Erscheinen bestaetigt den Upload
    async function loadSelection() {
      if (!token) {
        return;
      }

      fileList.innerHTML = '<p class="file-list-hint">Lade Bilder…</p>';

      try {
        const response = await fetch('/' + token + '/meta');
        if (!response.ok) {
          throw new Error('Meta nicht erreichbar');
        }
        const meta = await response.json();

        fileList.innerHTML = '';

        const caption = document.createElement('p');
        caption.className = 'file-list-caption';
        caption.textContent = meta.images.length + ' Bilder hochgeladen. Bild antippen = Favorit — genau N markieren, dann speichern.';
        fileList.appendChild(caption);

        const grid = document.createElement('div');
        grid.className = 'preview-grid';
        fileList.appendChild(grid);

        for (let i = 0; i < meta.images.length; i++) {
          const image = meta.images[i];

          const item = document.createElement('label');
          item.className = 'preview-item';
          item.title = image.originalname;

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.dataset.filename = image.originalname;
          checkbox.addEventListener('change', updateSelectionState);

          const img = document.createElement('img');
          img.src = '/' + token + '/thumbs/' + encodeURIComponent(image.filename);
          img.alt = image.originalname;
          img.loading = 'lazy';

          const star = document.createElement('span');
          star.className = 'preview-star';
          star.setAttribute('aria-hidden', 'true');

          item.appendChild(checkbox);
          item.appendChild(img);
          item.appendChild(star);
          grid.appendChild(item);
        }

        saveSelectionBtn.hidden = false;
        updateSelectionState();
      } catch (err) {
        showError('Fehler beim Laden der Bilder: ' + err.message);
      }
    }

    function checkedFilenames() {
      return Array.from(fileList.querySelectorAll('input[type="checkbox"]:checked'))
        .map(cb => cb.dataset.filename);
    }

    // Zwei Button-States: inaktiv (grau) bis genau N Favoriten, dann aktiv (schwarz)
    function updateSelectionState() {
      if (saveSelectionBtn.hidden) {
        return;
      }

      const n = parseInt(nInput.value);

      if (isNaN(n) || n < 1) {
        saveSelectionBtn.disabled = true;
        saveSelectionBtn.textContent = checkedFilenames().length + ' von N — N festlegen';
        return;
      }

      const count = checkedFilenames().length;
      saveSelectionBtn.textContent = count + ' von ' + n;
      saveSelectionBtn.disabled = count !== n;
    }

    nInput.addEventListener('input', updateSelectionState);

    // 4.1 Auswahl speichern: Favoriten an den Server, dann Link aktiv
    saveSelectionBtn.addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      const favorites = checkedFilenames();

      saveSelectionBtn.disabled = true;
      saveSelectionBtn.textContent = 'Speichern…';

      try {
        const response = await fetch('/' + token + '/favorites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password, favorites: favorites }),
        });
        const result = await response.json();

        if (result.ok) {
          saveSelectionBtn.textContent = 'Favoriten gespeichert';

          const link = location.origin + '/' + token;
          tokenLink.href = link;
          tokenLink.textContent = link;
          tokenLink.classList.remove('disabled');
          tokenLink.classList.add('active');
          tokenLink.removeAttribute('aria-disabled');
          copyBtn.disabled = false;
        } else {
          showError(result.error || 'Unbekannter Fehler');
          updateSelectionState();
        }
      } catch (err) {
        showError('Netzwerkfehler: ' + err.message);
        updateSelectionState();
      }
    });

    // Nach Reload den letzten Upload wiederherstellen
    if (token) {
      loadSelection();
    }

    // Fehler anzeigen
    function showError(message) {
      errorDiv.classList.remove('hidden');
      errorMessage.textContent = message;
    }

    // Kopieren-Funktion
    copyBtn.addEventListener('click', () => {
      const link = tokenLink.href;
      navigator.clipboard.writeText(link).then(() => {
        copyBtn.textContent = 'Kopiert!';
        setTimeout(() => {
          copyBtn.textContent = 'Kopieren';
        }, 2000);
      });
    });

    // Erneut versuchen
    retryBtn.addEventListener('click', () => {
      errorDiv.classList.add('hidden');
      fileInput.disabled = false;
      fileInput.value = '';
      fileList.innerHTML = '<p class="file-list-hint">Bilder auswählen, dann beginnen der Upload und die Auswahl.</p>';
      saveSelectionBtn.hidden = true;
    });
  </script>
</body>
</html>
