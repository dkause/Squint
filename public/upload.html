<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squint – Upload</title>
  <link rel="stylesheet" href="upload.css">
</head>
<body>
  <main class="upload-container">
    <h1>Squint – Bilder hochladen</h1>

    <form id="uploadForm" class="upload-form">
      <ol class="steps">
        <li class="step">
          <div class="form-group">
            <label for="password">1. Passwort:</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="off"
            >
          </div>
        </li>

        <li class="step">
          <div class="form-group">
            <label for="n">2. Anzahl für die Kundenauswahl (N, kleiner als Bildanzahl):</label>
            <input
              type="number"
              id="n"
              name="n"
              min="1"
              required
            >
          </div>
        </li>

        <li class="step">
          <div class="form-group">
            <label for="images">3. Bilder auswählen (mehrere):</label>
            <input
              type="file"
              id="images"
              name="images"
              accept="image/*"
              multiple
              required
            >
          </div>
          <button type="submit" id="uploadBtn" class="submit-btn" disabled>3.1 Hochladen</button>
        </li>

        <li class="step">
          <span class="step-label">4. Auswahl (Favoriten, optional):</span>
          <div id="fileList" class="file-list">
            <p class="file-list-hint">Noch keine Bilder ausgewählt.</p>
          </div>
        </li>
      </ol>
    </form>

    <div id="result" class="result hidden">
      <h2>5. Kunden-Link</h2>
      <p>Geheimer Link für den Kunden:</p>
      <div class="token-link-container">
        <a id="tokenLink" class="token-link disabled" aria-disabled="true">Link wird erzeugt…</a>
        <button id="copyBtn" class="copy-btn" disabled>Kopieren</button>
      </div>
      <p class="warning">⚠️ Link nur an den Kunden schicken!</p>
    </div>

    <div id="error" class="error hidden">
      <h2>Fehler</h2>
      <p id="errorMessage"></p>
      <button id="retryBtn" class="retry-btn">Erneut versuchen</button>
    </div>
  </main>

  <script>
    // DOM-Elemente
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('images');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileList = document.getElementById('fileList');
    const nInput = document.getElementById('n');
    const resultDiv = document.getElementById('result');
    const tokenLink = document.getElementById('tokenLink');
    const copyBtn = document.getElementById('copyBtn');
    const errorDiv = document.getElementById('error');
    const errorMessage = document.getElementById('errorMessage');
    const retryBtn = document.getElementById('retryBtn');

    // 4. Auswahl: Liste der gewählten Bilder mit Favoriten-Haken
    fileInput.addEventListener('change', updateFileList);

    function updateFileList() {
      const files = fileInput.files;

      fileList.innerHTML = '';

      if (files.length === 0) {
        fileList.innerHTML = '<p class="file-list-hint">Noch keine Bilder ausgewählt.</p>';
        uploadBtn.disabled = true;
        return;
      }

      const caption = document.createElement('p');
      caption.className = 'file-list-caption';
      caption.textContent = files.length + ' Bilder. Haken = Favorit (optional, Match-Hinweis beim Kunden).';
      fileList.appendChild(caption);

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const fileId = 'file-' + i;

        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = fileId;
        checkbox.dataset.filename = file.name;
        checkbox.title = 'Favorit: ' + file.name;

        const label = document.createElement('label');
        label.htmlFor = fileId;
        label.textContent = file.name;

        fileItem.appendChild(checkbox);
        fileItem.appendChild(label);
        fileList.appendChild(fileItem);
      }

      // N vorbelegen, falls leer (Hälfte der Bilder)
      if (nInput.value === '') {
        nInput.value = Math.max(1, Math.floor(files.length / 2));
      }

      uploadBtn.disabled = false;
    }

    // 3.1 Hochladen: ein Vorgang — Passwort, N, Bilder, Favoriten, ein Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const files = fileInput.files;

      if (files.length === 0) {
        showError('Bitte mindestens ein Bild auswählen');
        return;
      }

      const n = parseInt(nInput.value);
      if (isNaN(n) || n < 1 || n >= files.length) {
        showError('N muss eine Zahl zwischen 1 und ' + (files.length - 1) + ' sein');
        return;
      }

      const favorites = Array.from(fileList.querySelectorAll('input[type="checkbox"]:checked'))
        .map(cb => cb.dataset.filename);

      const formData = new FormData();
      formData.append('password', password);
      formData.append('n', n.toString());
      formData.append('favorites', JSON.stringify(favorites));

      for (let i = 0; i < files.length; i++) {
        formData.append('images', files[i]);
      }

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Lädt hoch…';

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        const result = await response.json();

        if (result.token) {
          form.classList.add('hidden');
          errorDiv.classList.add('hidden');
          resultDiv.classList.remove('hidden');

          const link = location.origin + '/' + result.token;
          tokenLink.href = link;
          tokenLink.textContent = link;
          tokenLink.classList.remove('disabled');
          tokenLink.removeAttribute('aria-disabled');
          copyBtn.disabled = false;
        } else {
          showError(result.error || 'Unbekannter Fehler');
        }
      } catch (err) {
        showError('Netzwerkfehler: ' + err.message);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = '3.1 Hochladen';
      }
    });

    // Fehler anzeigen
    function showError(message) {
      resultDiv.classList.add('hidden');
      errorDiv.classList.remove('hidden');
      errorMessage.textContent = message;
    }

    // Kopieren-Funktion
    copyBtn.addEventListener('click', () => {
      const link = tokenLink.href;
      navigator.clipboard.writeText(link).then(() => {
        copyBtn.textContent = 'Kopiert!';
        setTimeout(() => {
          copyBtn.textContent = 'Kopieren';
        }, 2000);
      });
    });

    // Erneut versuchen
    retryBtn.addEventListener('click', () => {
      errorDiv.classList.add('hidden');
      form.classList.remove('hidden');
      form.reset();
      updateFileList();
    });
  </script>
</body>
</html>
