<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squint – Upload</title>
  <link rel="stylesheet" href="upload.css">
</head>
<body>
  <main class="upload-container">
    <h1>Squint – Bilder hochladen</h1>

    <form id="uploadForm" class="upload-form">
      <ol class="steps">
        <li class="step">
          <div class="form-group">
            <label for="password">1. Passwort:</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="off"
            >
          </div>
        </li>

        <li class="step">
          <div class="form-group">
            <label for="n">2. Anzahl für die Kundenauswahl (N, kleiner als Bildanzahl):</label>
            <input
              type="number"
              id="n"
              name="n"
              min="1"
              required
            >
          </div>
        </li>

        <li class="step">
          <div class="form-group">
            <label for="images">3. Bilder auswählen (mehrere):</label>
            <input
              type="file"
              id="images"
              name="images"
              accept="image/*"
              multiple
              required
            >
          </div>
          <button type="submit" id="uploadBtn" class="submit-btn" disabled>Hochladen</button>
        </li>

        <li class="step">
          <span class="step-label">4. Auswahl (Favoriten):</span>
          <div id="fileList" class="file-list">
            <p class="file-list-hint">Noch keine Bilder ausgewählt.</p>
          </div>
          <button type="button" id="saveSelectionBtn" class="submit-btn" disabled>0 von N</button>
        </li>

        <li class="step">
          <span class="step-label">5. Kunden-Link:</span>
          <div class="token-link-container">
            <a id="tokenLink" class="token-link disabled" aria-disabled="true">Link wird nach dem Upload erzeugt…</a>
            <button id="copyBtn" class="copy-btn" disabled>Kopieren</button>
          </div>
          <p class="warning">⚠️ Link nur an den Kunden schicken!</p>
        </li>
      </ol>
    </form>

    <div id="error" class="error hidden">
      <h2>Fehler</h2>
      <p id="errorMessage"></p>
      <button id="retryBtn" class="retry-btn">Erneut versuchen</button>
    </div>
  </main>

  <script>
    // DOM-Elemente
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('images');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileList = document.getElementById('fileList');
    const nInput = document.getElementById('n');
    const tokenLink = document.getElementById('tokenLink');
    const copyBtn = document.getElementById('copyBtn');
    const errorDiv = document.getElementById('error');
    const errorMessage = document.getElementById('errorMessage');
    const retryBtn = document.getElementById('retryBtn');
    const saveSelectionBtn = document.getElementById('saveSelectionBtn');

    let favorites = [];
    let objectUrls = [];

    // 4. Auswahl: Preview-Grid der gewählten Bilder, Haken = Favorit
    fileInput.addEventListener('change', updateFileList);
    nInput.addEventListener('input', updateSelectionState);

    function updateFileList() {
      const files = fileInput.files;

      for (const url of objectUrls) {
        URL.revokeObjectURL(url);
      }
      objectUrls = [];
      favorites = [];
      fileList.innerHTML = '';

      if (files.length === 0) {
        fileList.innerHTML = '<p class="file-list-hint">Noch keine Bilder ausgewählt.</p>';
        uploadBtn.disabled = true;
        return;
      }

      const caption = document.createElement('p');
      caption.className = 'file-list-caption';
      caption.textContent = files.length + ' Bilder. Bild antippen = Favorit (optional, Match-Hinweis beim Kunden).';
      fileList.appendChild(caption);

      const grid = document.createElement('div');
      grid.className = 'preview-grid';
      fileList.appendChild(grid);

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const fileId = 'file-' + i;
        const url = URL.createObjectURL(file);
        objectUrls.push(url);

        const item = document.createElement('label');
        item.className = 'preview-item';
        item.title = file.name;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.dataset.filename = file.name;
        checkbox.addEventListener('change', updateSelectionState);

        const img = document.createElement('img');
        img.src = url;
        img.alt = file.name;
        img.loading = 'lazy';

        const star = document.createElement('span');
        star.className = 'preview-star';
        star.setAttribute('aria-hidden', 'true');

        item.appendChild(checkbox);
        item.appendChild(img);
        item.appendChild(star);
        grid.appendChild(item);
      }

      updateSelectionState();

      // N vorbelegen, falls leer (Hälfte der Bilder)
      if (nInput.value === '') {
        nInput.value = Math.max(1, Math.floor(files.length / 2));
        updateSelectionState();
      }

      uploadBtn.disabled = false;
    }

    function checkedFilenames() {
      return Array.from(fileList.querySelectorAll('input[type="checkbox"]:checked'))
        .map(cb => cb.dataset.filename);
    }

    // Zwei Button-States: inaktiv (grau) bis genau N Favoriten, dann aktiv (schwarz)
    function updateSelectionState() {
      const n = parseInt(nInput.value);

      if (isNaN(n) || n < 1) {
        saveSelectionBtn.disabled = true;
        saveSelectionBtn.textContent = checkedFilenames().length + ' von N — N festlegen';
        return;
      }

      const count = checkedFilenames().length;
      saveSelectionBtn.textContent = count + ' von ' + n;
      saveSelectionBtn.disabled = count !== n;
    }

    // 4.1 Auswahl speichern: Bestätigung im gleichen Button-Design
    saveSelectionBtn.addEventListener('click', () => {
      favorites = checkedFilenames();
      saveSelectionBtn.disabled = false;
      saveSelectionBtn.textContent = 'Favoriten gespeichert';
    });

    // Hochladen: ein Vorgang — Passwort, N, Bilder, Favoriten, ein Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const files = fileInput.files;

      if (files.length === 0) {
        showError('Bitte mindestens ein Bild auswählen');
        return;
      }

      const n = parseInt(nInput.value);
      if (isNaN(n) || n < 1 || n >= files.length) {
        showError('N muss eine Zahl zwischen 1 und ' + (files.length - 1) + ' sein');
        return;
      }

      const formData = new FormData();
      formData.append('password', password);
      formData.append('n', n.toString());
      formData.append('favorites', JSON.stringify(favorites));

      for (let i = 0; i < files.length; i++) {
        formData.append('images', files[i]);
      }

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Lädt hoch…';

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        const result = await response.json();

        if (result.token) {
          errorDiv.classList.add('hidden');

          const link = location.origin + '/' + result.token;
          tokenLink.href = link;
          tokenLink.textContent = link;
          tokenLink.classList.remove('disabled');
          tokenLink.classList.add('active');
          tokenLink.removeAttribute('aria-disabled');
          copyBtn.disabled = false;
        } else {
          showError(result.error || 'Unbekannter Fehler');
        }
      } catch (err) {
        showError('Netzwerkfehler: ' + err.message);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Hochladen';
      }
    });

    // Fehler anzeigen
    function showError(message) {
      errorDiv.classList.remove('hidden');
      errorMessage.textContent = message;
    }

    // Kopieren-Funktion
    copyBtn.addEventListener('click', () => {
      const link = tokenLink.href;
      navigator.clipboard.writeText(link).then(() => {
        copyBtn.textContent = 'Kopiert!';
        setTimeout(() => {
          copyBtn.textContent = 'Kopieren';
        }, 2000);
      });
    });

    // Erneut versuchen
    updateSelectionState();

    retryBtn.addEventListener('click', () => {
      errorDiv.classList.add('hidden');
      form.classList.remove('hidden');
      form.reset();
      updateFileList();
    });
  </script>
</body>
</html>
