<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squint – Upload</title>
  <link rel="stylesheet" href="upload.css">
</head>
<body>
  <main class="upload-container">
    <h1>Squint – Bilder hochladen</h1>

    <form id="uploadForm" class="upload-form">
      <ol class="steps">
        <li class="step">
          <div class="form-group">
            <label for="password">1. Passwort:</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="off"
            >
          </div>
        </li>

        <li class="step">
          <div class="form-group">
            <label for="n">2. Anzahl für die Kundenauswahl (N, kleiner als Bildanzahl):</label>
            <input
              type="number"
              id="n"
              name="n"
              min="1"
              required
            >
          </div>
        </li>

        <li class="step">
          <div class="form-group">
            <label for="images">3. Bilder auswählen (mehrere):</label>
            <input
              type="file"
              id="images"
              name="images"
              accept="image/*"
              multiple
              required
            >
          </div>
          <button type="submit" class="submit-btn">3.1 Hochladen</button>
        </li>
      </ol>
    </form>

    <div id="result" class="result hidden">
      <div id="selectionArea">
        <h2>4. Auswahl (Favoriten, optional)</h2>
        <div id="fileList" class="file-list"></div>
        <button id="confirmBtn" class="submit-btn">Auswahl bestätigen</button>
      </div>

      <div id="linkArea" class="hidden">
        <h2>5. Kunden-Link</h2>
        <p>Geheimer Link für den Kunden:</p>
        <div class="token-link-container">
          <a id="tokenLink" class="token-link disabled" aria-disabled="true">Link wird erzeugt…</a>
          <button id="copyBtn" class="copy-btn" disabled>Kopieren</button>
        </div>
        <p class="warning">⚠️ Link nur an den Kunden schicken!</p>
      </div>
    </div>

    <div id="error" class="error hidden">
      <h2>Fehler</h2>
      <p id="errorMessage"></p>
      <button id="retryBtn" class="retry-btn">Erneut versuchen</button>
    </div>
  </main>

  <script>
    // DOM-Elemente
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('images');
    const fileList = document.getElementById('fileList');
    const nInput = document.getElementById('n');
    const resultDiv = document.getElementById('result');
    const selectionArea = document.getElementById('selectionArea');
    const linkArea = document.getElementById('linkArea');
    const confirmBtn = document.getElementById('confirmBtn');
    const tokenLink = document.getElementById('tokenLink');
    const copyBtn = document.getElementById('copyBtn');
    const errorDiv = document.getElementById('error');
    const errorMessage = document.getElementById('errorMessage');
    const retryBtn = document.getElementById('retryBtn');

    let currentToken = null;

    // 3.1 Hochladen (Phase A)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const files = fileInput.files;

      if (files.length === 0) {
        showError('Bitte mindestens ein Bild auswählen');
        return;
      }

      const n = parseInt(nInput.value);
      if (isNaN(n) || n < 1 || n >= files.length) {
        showError('N muss eine Zahl zwischen 1 und ' + (files.length - 1) + ' sein');
        return;
      }

      const formData = new FormData();
      formData.append('password', password);
      formData.append('n', n.toString());

      for (let i = 0; i < files.length; i++) {
        formData.append('images', files[i]);
      }

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        const result = await response.json();

        if (result.token) {
          currentToken = result.token;
          showSelection();
        } else {
          showError(result.error || 'Unbekannter Fehler');
        }
      } catch (err) {
        showError('Netzwerkfehler: ' + err.message);
      }
    });

    // 4. Auswahl: Bilder des Sets mit Favoriten-Checkboxen
    async function showSelection() {
      form.classList.add('hidden');
      errorDiv.classList.add('hidden');
      resultDiv.classList.remove('hidden');
      selectionArea.classList.remove('hidden');
      linkArea.classList.add('hidden');

      fileList.innerHTML = '<p class="file-list-hint">Lade Bilder…</p>';

      try {
        const response = await fetch('/' + currentToken + '/meta');
        const meta = await response.json();

        fileList.innerHTML = '';

        const caption = document.createElement('p');
        caption.className = 'file-list-caption';
        caption.textContent = meta.images.length + ' Bilder hochgeladen. Haken = Favorit (optional, Match-Hinweis beim Kunden).';
        fileList.appendChild(caption);

        for (let i = 0; i < meta.images.length; i++) {
          const image = meta.images[i];
          const fileId = 'file-' + i;

          const fileItem = document.createElement('div');
          fileItem.className = 'file-item';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.id = fileId;
          checkbox.dataset.filename = image.originalname;
          checkbox.title = 'Favorit: ' + image.originalname;

          checkbox.addEventListener('change', () => {
            const checked = fileList.querySelectorAll('input[type="checkbox"]:checked');
            confirmBtn.textContent = checked.length > 0
              ? 'Auswahl bestätigen (' + checked.length + ' Favoriten)'
              : 'Auswahl bestätigen';
          });

          const label = document.createElement('label');
          label.htmlFor = fileId;
          label.textContent = image.originalname;

          fileItem.appendChild(checkbox);
          fileItem.appendChild(label);
          fileList.appendChild(fileItem);
        }
      } catch (err) {
        showError('Fehler beim Laden der Bilder: ' + err.message);
      }
    }

    // 4.1 Auswahl bestätigen -> Favoriten speichern, Link aktivieren (Phase B)
    confirmBtn.addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      const favorites = Array.from(fileList.querySelectorAll('input[type="checkbox"]:checked'))
        .map(cb => cb.dataset.filename);

      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Speichern…';

      try {
        const response = await fetch('/' + currentToken + '/favorites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password, favorites: favorites }),
        });
        const result = await response.json();

        if (result.ok) {
          showLink();
        } else {
          showError(result.error || 'Unbekannter Fehler');
        }
      } catch (err) {
        showError('Netzwerkfehler: ' + err.message);
      } finally {
        confirmBtn.disabled = false;
      }
    });

    // 5. Link aktivieren
    function showLink() {
      selectionArea.classList.add('hidden');
      linkArea.classList.remove('hidden');

      const link = location.origin + '/' + currentToken;
      tokenLink.href = link;
      tokenLink.textContent = link;
      tokenLink.classList.remove('disabled');
      tokenLink.removeAttribute('aria-disabled');
      copyBtn.disabled = false;
    }

    // Fehler anzeigen
    function showError(message) {
      form.classList.remove('hidden');
      resultDiv.classList.add('hidden');
      errorDiv.classList.remove('hidden');
      errorMessage.textContent = message;
    }

    // Kopieren-Funktion
    copyBtn.addEventListener('click', () => {
      const link = tokenLink.href;
      navigator.clipboard.writeText(link).then(() => {
        copyBtn.textContent = 'Kopiert!';
        setTimeout(() => {
          copyBtn.textContent = 'Kopieren';
        }, 2000);
      });
    });

    // Erneut versuchen
    retryBtn.addEventListener('click', () => {
      errorDiv.classList.add('hidden');
      resultDiv.classList.add('hidden');
      form.classList.remove('hidden');
      form.reset();
      currentToken = null;
    });
  </script>
</body>
</html>
